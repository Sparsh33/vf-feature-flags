services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Require AUTH so Celery brokers cannot be hit by anything that happens
    # to land on the compose network / exposed port without credentials.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-local-dev-redis}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-local-dev-redis}"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1:8b}"
      OLLAMA_INIT_MAX_ATTEMPTS: "${OLLAMA_INIT_MAX_ATTEMPTS:-5}"
    entrypoint: ["/bin/sh", "-c"]
    # Retry the pull up to OLLAMA_INIT_MAX_ATTEMPTS times with backoff so that a
    # transient network blip during the ~4.7 GB download does not deadlock `api`
    # (which waits on `service_completed_successfully`).
    command:
      - >
        echo "[ollama-init] pulling $$OLLAMA_MODEL (idempotent; no-op if already present)";
        attempt=1;
        max_attempts=$${OLLAMA_INIT_MAX_ATTEMPTS:-5};
        until ollama pull "$$OLLAMA_MODEL"; do
          if [ "$$attempt" -ge "$$max_attempts" ]; then
            echo "[ollama-init] giving up after $$attempt attempts";
            exit 1;
          fi;
          echo "[ollama-init] pull failed (attempt $$attempt/$$max_attempts); retrying in 5s...";
          attempt=$$((attempt + 1));
          sleep 5;
        done;
        echo "[ollama-init] done"
    restart: "on-failure:3"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENV: "${ENV:-local}"
      MONGO_URI: "${MONGO_URI:-mongodb://mongo:27017}"
      MONGO_DB: "${MONGO_DB:-vf_feature_flags}"
      REDIS_URL: "${REDIS_URL:-redis://:${REDIS_PASSWORD:-local-dev-redis}@redis:6379/0}"
      CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:-local-dev-redis}@redis:6379/1}"
      # No default: compose fails fast if JWT_SECRET is unset, preventing a
      # fresh clone from booting with a known, git-visible signing key.
      # For local dev, set JWT_SECRET in .env (see .env.example).
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env or the environment (no default; see .env.example)}"
      JWT_TTL_MINUTES: "${JWT_TTL_MINUTES:-1440}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      NL_PROVIDER: "${NL_PROVIDER:-ollama}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1:8b}"
      NL_INPUT_TOKEN_BUDGET: "${NL_INPUT_TOKEN_BUDGET:-8192}"
      NL_COMPACTION_TRIGGER: "${NL_COMPACTION_TRIGGER:-0.70}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      ENV: "${ENV:-local}"
      MONGO_URI: "${MONGO_URI:-mongodb://mongo:27017}"
      MONGO_DB: "${MONGO_DB:-vf_feature_flags}"
      REDIS_URL: "${REDIS_URL:-redis://:${REDIS_PASSWORD:-local-dev-redis}@redis:6379/0}"
      CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:-local-dev-redis}@redis:6379/1}"
      # No default: compose fails fast if JWT_SECRET is unset, preventing a
      # fresh clone from booting with a known, git-visible signing key.
      # For local dev, set JWT_SECRET in .env (see .env.example).
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env or the environment (no default; see .env.example)}"
      NL_PROVIDER: "${NL_PROVIDER:-ollama}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1:8b}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A celery_app.celery worker --loglevel=info

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mongo_data:
  redis_data:
  ollama_data:
